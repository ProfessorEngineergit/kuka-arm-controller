# Robot Configuration – 5-DOF Desktop Arm
# Servos: Metal MG996R (J1/Basis ch5), MG996R (J2/Schulter ch4), MG90S (J3 ch2, J4 ch1, J5 ch0)
# Channel mapping verified by physical test 2026-05-18

servos:
  frequency: 50
  default_speed: 8    # deg/s – langsam, kein Gegengewicht

  types:
    mg996r:
      pulse_min_us: 500
      pulse_max_us: 2500
      max_speed_dps: 20
    mg996r_metal:
      pulse_min_us: 500
      pulse_max_us: 2500
      max_speed_dps: 20
    mg90s:
      pulse_min_us: 600
      pulse_max_us: 2400
      max_speed_dps: 30

joints:
  - id: 0
    name: J1
    label: "Basis"
    channel: 5
    servo_type: mg996r_metal
    min_angle: 0
    max_angle: 180
    home_angle: 90
    invert: false

  - id: 1
    name: J2
    label: "Schulter"
    channel: 4
    servo_type: mg996r
    min_angle: 30
    max_angle: 150
    home_angle: 90
    invert: false

  - id: 2
    name: J3
    label: "Ellbogen"
    channel: 2
    servo_type: mg90s
    min_angle: 0
    max_angle: 160
    home_angle: 90
    invert: false

  - id: 3
    name: J4
    label: "Handgelenk"
    channel: 1
    servo_type: mg90s
    min_angle: 0
    max_angle: 180
    home_angle: 90
    invert: false

  - id: 4
    name: J5
    label: "Greifer"
    channel: 0
    servo_type: mg90s
    min_angle: 0
    max_angle: 90
    home_angle: 0
    invert: false

# Denavit-Hartenberg Parameter (5-DOF)
dh_parameters:
  - [0,    90,  60,   0]
  - [100,   0,   0,   0]
  - [90,    0,   0,   0]
  - [0,    90,   0,   0]
  - [0,     0,  55,   0]

security:
  inactivity_timeout_sec: 600
  require_enable_before_move: true
  estop_requires_acknowledge: true
